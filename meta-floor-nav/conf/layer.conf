# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-floor-nav"
BBFILE_PATTERN_meta-floor-nav = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-floor-nav = "6"

LAYERDEPENDS_meta-floor-nav = "core"
LAYERSERIES_COMPAT_meta-floor-nav = "scarthgap"
